<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character and Word Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="icon">📝</div>
        <h1>Character & Word Counter</h1>
        <p class="subtitle">Count your characters, words, and sentences instantly.</p>

        <label for="textInput">Enter or paste your text</label>
        <textarea id="textInput" placeholder="Start typing here..." rows="8"></textarea>

        <div class="stats">
            <div class="stat-card">
                <span id="charCount">0</span>
                <p>Characters</p>
            </div>
            <div class="stat-card">
                <span id="charNoSpaces">0</span>
                <p>Without Spaces</p>
            </div>
            <div class="stat-card">
                <span id="wordCount">0</span>
                <p>Words</p>
            </div>
            <div class="stat-card">
                <span id="sentenceCount">0</span>
                <p>Sentences</p>
            </div>
        </div>

        <button id="clearBtn" type="button">Clear Text</button>
        <p class="footer">✨ Simple, fast, and easy to use</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
